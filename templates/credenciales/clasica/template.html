<div class="credencial-clasica-container">
  <div class="credencial-bg-huellas"></div>
  <div class="credencial-contenido">
    <div class="credencial-foto-wrapper">
      <img src="{{foto}}" class="credencial-foto" alt="Foto de mascota">
    </div>
    <div class="credencial-datos">
      <div class="credencial-titulo">{{nombre}}</div>
      <div class="credencial-item"><strong>ESPECIE:</strong> {{especie}}</div>
      <div class="credencial-item"><strong>RAZA:</strong> {{raza}}</div>
      <div class="credencial-item"><strong>NACIMIENTO:</strong> {{fecha_nacimiento}}</div>
      <div class="credencial-item"><strong>CURM:</strong> {{curm}}</div>
      <div class="credencial-item"><strong>DUEÑO:</strong> {{nombre_dueno}}</div>
      <div class="credencial-item"><strong>TEL:</strong> {{telefono}}</div>
      <div class="credencial-barcode">{{barcode_svg}}</div>
    </div>
  </div>
</div>
